[project]
name = "amazon-meli-publisher-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.1",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
  "playwright>=1.44.0",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12.3",
  "json5>=0.9.25,<1.0",
  "openpyxl>=3.1.5,<4.0",
  "oss2>=2.19.1,<3.0",
  "Pillow>=10.4.0,<13.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
