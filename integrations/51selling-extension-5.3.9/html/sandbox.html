<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <script type="text/javascript">
        window.addEventListener('message', async function (event) {
            var result = { "LiSellingTempPwd": event.data.LiSellingTempPwd };
            var data = {};
            try {
                eval(event.data.JsStr);
                if (event.data.Varname && event.data.Varname.length > 0) {
                    for (var i = 0; i < event.data.Varname.length; i++) {
                        try {
                            data[event.data.Varname[i]] = eval(event.data.Varname[i]);
                        } catch (e) { }
                    }
                }
                data = JSON.stringify(data);
                result["data"] = data;
                event.source.window.postMessage(result, event.origin);
            } catch (e) {
                event.source.window.postMessage(result, event.origin);
            }
        });
    </script>
</body>
</html>
